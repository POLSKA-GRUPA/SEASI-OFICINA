name: ci

on: [push]

jobs:
  quality:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: seasi-despacho
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/SEASI-CORE
          path: SEASI-CORE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar contratos + gate de digests + auditoría IPC
        working-directory: seasi-despacho
        run: |
          npm install --no-audit --no-fund
          npm run contracts:check
          npm run audit:ipc
          npm run typecheck
          npm test
        env:
          SEASI_SCHEMAS_DIR: ${{ github.workspace }}/SEASI-CORE/schemas/v1
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        shell: bash
